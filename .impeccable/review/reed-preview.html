<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../apps/reed/assets/">
  <link rel="stylesheet" href="app.css?v=3">
  <title>Reed</title>
</head>
<body>
  <div class="shell">
    <nav class="rail">
      <div class="rail-head"><div class="brand">Reed</div></div>
      <div class="rail-nav">
        <a class="rail-link" href="/" aria-current="page">Home</a>
        <a class="rail-link" href="/d">Discover</a>
        <a class="rail-link" href="/compose">Compose</a>
        <a class="rail-link" href="/search">Search</a>
        <a class="rail-link" href="/settings">Settings</a>
        <a class="rail-link" href="/onboard">Identity</a>
      </div>
    </nav>
    <section class="stage">
      <div class="band"><span class="banner late">Cannot reach knot</span></div>
      <div class="sheet-cols"><span>Time</span><span>Author</span><span>Post</span></div>
      <div class="log sheet">
        <article class="tweet">
          <div class="tweet-row">
            <a class="avatar-link" href="/p/ada">Ada</a>
            <div class="tweet-body">
              <div class="tweet-meta">
                <a class="tweet-name" href="/p/ada">Ada</a>
                <span class="tweet-handle">ada</span>
                <span class="tweet-sep">·</span>
                <a class="tweet-time" href="/t/1">09:14</a>
              </div>
              <a class="tweet-text" href="/t/1"><p>keep this</p></a>
              <div class="tweet-actions">
                <a class="tweet-action" href="/t/1"><span class="verb">Reply</span></a>
                <button class="tweet-action" type="button"><span class="verb">Boost</span></button>
                <button class="tweet-action" type="button"><span class="verb">Like</span></button>
              </div>
            </div>
          </div>
        </article>
        <article class="tweet">
          <div class="tweet-row">
            <a class="avatar-link" href="/p/bob">Bob</a>
            <div class="tweet-body">
              <div class="tweet-meta">
                <a class="tweet-name" href="/p/bob">Bob</a>
                <a class="tweet-time" href="/t/2">09:02</a>
              </div>
              <a class="tweet-text" href="/t/2"><p>the knot answered</p></a>
              <div class="tweet-actions">
                <a class="tweet-action" href="/t/2"><span class="verb">Reply</span></a>
              </div>
            </div>
          </div>
        </article>
      </div>
    </section>
  </div>
</body>
</html>
