# Format, clippy, workspace tests, and live SNS JSON-RPC against solana-test-validator.
#
# Commands match `just fmt`, `just clippy`, and `just test`.
# Solana CLI: Agave v4.2.1 (includes `solana-test-validator`).
# Do not point SOLANA_RPC at mainnet-beta.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  SOLANA_CLI_VERSION: v4.2.1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Workspace tests (no Solana RPC)
        run: cargo test --workspace

      - name: Cache Solana CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/install
          key: solana-${{ env.SOLANA_CLI_VERSION }}-${{ runner.os }}

      - name: Install Solana CLI (Agave ${{ env.SOLANA_CLI_VERSION }})
        run: |
          BIN="$HOME/.local/share/solana/install/active_release/bin"
          if [[ ! -x "$BIN/solana-test-validator" ]]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_CLI_VERSION}/install)"
          fi
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/solana" --version
          "$BIN/solana-test-validator" --version

      - name: Start solana-test-validator with SNS fixtures
        run: scripts/sns-validator.sh --bg

      - name: SNS live RPC tests
        env:
          SOLANA_RPC: http://127.0.0.1:8899
        run: cargo test -p tangled --test sns_rpc -- --ignored --nocapture

      - name: Upload validator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solana-test-validator-logs
          path: |
            target/sns-test-ledger/validator.log
            target/sns-test-ledger/validator-*.log
            target/sns-test-ledger/stdout.log
          if-no-files-found: warn

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build static site
        working-directory: site
        env:
          ASTRO_SITE: https://dodecahedr0x.github.io
          ASTRO_BASE: /tangled
        run: npm ci && npm run build
