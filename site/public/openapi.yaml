openapi: 3.1.0
info:
  title: Tangled Knot HTTP API
  version: "1"
  description: |
    Knot methods under `/xrpc/tangled.*`. DAG-CBOR is canonical; JSON is the IPLD mapping.
    See spec/12-http-api.md.
servers:
  - url: https://knot.example
    description: Example knot
tags:
  - name: node
  - name: sync
  - name: repo
  - name: identity
  - name: cap
  - name: loom
paths:
  /xrpc/tangled.node.describe:
    get:
      tags: [node]
      operationId: tangled.node.describe
      summary: Advertise profiles, foreign protocols, and blob limits
      responses:
        "200":
          description: Node description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDescribe"
              example:
                v: 1
                did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
                profiles: [knot.public, knot.cap, knot.sealed, knot.group]
                protocols: []
                maxBlob: 134217728
                custodialSign: false
  /xrpc/tangled.sync.getHead:
    get:
      tags: [sync]
      operationId: tangled.sync.getHead
      parameters:
        - in: query
          name: did
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current commit CID
          content:
            application/json:
              schema:
                type: object
                required: [did, commit, rev, knot]
                properties:
                  did: { type: string }
                  commit: { type: string }
                  rev: { type: string }
                  knot: { type: string, format: uri }
              example:
                did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
                commit: bafkr4igh2k3n4example
                rev: "3jzfcijpjiz2u"
                knot: https://knot.example
  /xrpc/tangled.sync.getRecord:
    get:
      tags: [sync]
      operationId: tangled.sync.getRecord
      parameters:
        - { in: query, name: did, required: true, schema: { type: string } }
        - { in: query, name: collection, required: true, schema: { type: string } }
        - { in: query, name: rkey, required: true, schema: { type: string } }
        - { in: header, name: Authorization, required: false, schema: { type: string } }
      responses:
        "200":
          description: Record, MST proof, commit
          content:
            application/json:
              schema:
                type: object
                required: [record, proof, commit]
                properties:
                  record: { type: object }
                  proof: { type: array, items: { type: object } }
                  commit: { type: object }
        "401":
          $ref: "#/components/responses/CapabilityRequired"
  /xrpc/tangled.sync.getBlob:
    get:
      tags: [sync]
      operationId: tangled.sync.getBlob
      parameters:
        - { in: query, name: did, required: true, schema: { type: string } }
        - { in: query, name: cid, required: true, schema: { type: string } }
        - { in: header, name: Authorization, required: false, schema: { type: string } }
      responses:
        "200":
          description: Raw blob bytes (codec raw 0x55, BLAKE3-256)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/CapabilityRequired"
        "404":
          description: NotFound
  /xrpc/tangled.sync.getBlocks:
    post:
      tags: [sync]
      operationId: tangled.sync.getBlocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cids]
              properties:
                cids:
                  type: array
                  maxItems: 256
                  items: { type: string }
            example:
              cids: ["bafkr4igh2k3n4example"]
      responses:
        "200":
          description: CAR bytes or JSON { blocks, missing }
          content:
            application/vnd.ipld.car:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: object
                properties:
                  missing: { type: array, items: { type: string } }
  /xrpc/tangled.sync.getRepo:
    get:
      tags: [sync]
      operationId: tangled.sync.getRepo
      parameters:
        - { in: query, name: did, required: true, schema: { type: string } }
        - { in: query, name: since, required: false, schema: { type: string } }
        - { in: query, name: blobs, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: CAR of the public repository
          content:
            application/vnd.ipld.car:
              schema: { type: string, format: binary }
  /xrpc/tangled.sync.getRepoAuth:
    post:
      tags: [sync]
      operationId: tangled.sync.getRepoAuth
      security: [{ cap: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did: { type: string }
                since: { type: string }
                blobs: { type: boolean }
      responses:
        "200":
          description: CAR of authorized collections
          content:
            application/vnd.ipld.car:
              schema: { type: string, format: binary }
  /xrpc/tangled.sync.queryBacklinks:
    get:
      tags: [sync]
      operationId: tangled.sync.queryBacklinks
      summary: Local public backlink index for a record CID
      description: |
        Returns public records this knot already stores whose envelope ref
        (or body reply) equals cid. MUST NOT crawl. count is an untrusted overlay.
      parameters:
        - { in: query, name: cid, required: true, schema: { type: string }, description: "Target record CID" }
        - { in: query, name: collection, required: false, schema: { type: string } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Observed public backlinks (overlay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkQuery"
              example:
                hits:
                  - did: did:sol:3hucrSyZCEokkGfhKtMCZgFx69qd9ZHZiBed7aEeByTw
                    collection: pub.tangled.annotation
                    rkey: 3jzfcijpjiz2u
                    cid: bafkr4igh2k3n4example
                    commit: bafkr4icommitexample
                count: 1
                overlay: true
                complete: false
        "404":
          description: MethodNotImplemented when the knot has no backlink index
  /xrpc/tangled.sync.notify:
    post:
      tags: [sync]
      operationId: tangled.sync.notify
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [did, commit]
              properties:
                did: { type: string }
                commit: { type: string }
            example:
              did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
              commit: bafkr4igh2k3n4example
      responses:
        "204": { description: Hint accepted or ignored }
  /xrpc/tangled.sync.subscribe:
    get:
      tags: [sync]
      operationId: tangled.sync.subscribe
      parameters:
        - { in: query, name: did, required: true, schema: { type: string } }
        - { in: query, name: collection, required: false, schema: { type: string } }
      responses:
        "101": { description: WebSocket upgrade }
  /xrpc/tangled.repo.putRecord:
    post:
      tags: [repo]
      operationId: tangled.repo.putRecord
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [record]
              properties:
                record: { type: object }
            example:
              record:
                v: 1
                collection: pub.tangled.post
                rkey: 3jzfcijpjiz2u
                vis: public
                body: { text: "hello" }
      responses:
        "200":
          description: New commit CID
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string }
                  commit: { type: string }
  /xrpc/tangled.repo.putBlob:
    post:
      tags: [repo]
      operationId: tangled.repo.putBlob
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Blob CID
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string }
        "413":
          description: BlobTooLarge
  /xrpc/tangled.repo.import:
    post:
      tags: [repo]
      operationId: tangled.repo.import
      parameters:
        - in: query
          name: force
          schema: { type: boolean }
      requestBody:
        content:
          application/vnd.ipld.car:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  commit: { type: string }
  /xrpc/tangled.identity.resolve:
    get:
      tags: [identity]
      operationId: tangled.identity.resolve
      parameters:
        - { in: query, name: handle, required: false, schema: { type: string } }
        - { in: query, name: did, required: false, schema: { type: string } }
      responses:
        "200":
          description: DID document location
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  idCid: { type: string }
                  endpoints:
                    type: array
                    items: { type: string }
              example:
                did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
                idCid: bafkr4idexample
                endpoints: ["https://knot.example"]
  /xrpc/tangled.cap.verify:
    post:
      tags: [cap]
      operationId: tangled.cap.verify
      requestBody:
        content:
          application/cbor:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cmd: { type: string }
                  res: { type: string }
        "403":
          $ref: "#/components/responses/CapabilityInvalid"
  /xrpc/tangled.loom.query:
    get:
      tags: [loom]
      operationId: tangled.loom.query
      parameters:
        - { in: query, name: q, required: true, schema: { type: string } }
        - { in: query, name: type, required: false, schema: { type: string }, description: "collection name, or ref to search by parent record CID" }
      responses:
        "200":
          description: Public hits. count is an untrusted overlay; complete is false in v1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkQuery"
  /xrpc/tangled.loom.firehose:
    get:
      tags: [loom]
      operationId: tangled.loom.firehose
      responses:
        "101": { description: WebSocket of public commits }
components:
  securitySchemes:
    cap:
      type: apiKey
      in: header
      name: Authorization
      description: "Cap <base64url(invocation)>"
    siws:
      type: apiKey
      in: cookie
      name: tangled_session
  responses:
    CapabilityRequired:
      description: Missing capability
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: CapabilityRequired
            message: vis cap or sealed requires Authorization Cap
            retry: false
    CapabilityInvalid:
      description: Capability failed verification
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        retry: { type: boolean }
    NodeDescribe:
      type: object
      required: [v, did, profiles, protocols, maxBlob]
      properties:
        v: { const: 1 }
        did: { type: string }
        profiles:
          type: array
          items: { type: string }
        protocols:
          type: array
          items: { type: string }
        maxBlob: { type: integer }
        custodialSign: { type: boolean }
    BacklinkHit:
      type: object
      required: [did, collection, rkey, cid, commit]
      properties:
        did: { type: string }
        collection: { type: string }
        rkey: { type: string }
        cid: { type: string }
        commit: { type: string }
    BacklinkQuery:
      type: object
      required: [hits, overlay]
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/BacklinkHit" }
        count: { type: integer, description: "Untrusted overlay. Distinct matching CIDs this observer stores." }
        overlay: { type: boolean, const: true }
        complete: { type: boolean, description: "MUST be false in v1." }
