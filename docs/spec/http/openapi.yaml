openapi: 3.1.0
info:
  title: Tangled Knot HTTP API
  version: "1"
  description: |
    Knot methods under `/xrpc/tangled.*`. DAG-CBOR is canonical. Clients MUST send
    `Accept: application/cbor, application/json`. When Accept prefers
    `application/cbor`, knots MUST serve DAG-CBOR; JSON is the IPLD mapping.
    `Authorization: Cap <base64url(DAG-CBOR(Invocation))>` — JSON-in-header MUST
    be rejected. SIWS cookie is `tangled_session`. There is no `listRecords`
    method; clients use `getRepo`. See docs/spec/12-http-api.md.
servers:
  - url: https://knot.example
    description: Example knot
tags:
  - name: node
  - name: sync
  - name: repo
  - name: identity
  - name: cap
  - name: session
  - name: loom
paths:
  /xrpc/tangled.node.describe:
    get:
      tags: [node]
      operationId: tangled.node.describe
      summary: Advertise profiles, foreign protocols, blob limits, and public peers
      responses:
        "200":
          description: Node description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDescribe"
              example:
                v: 1
                did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
                profiles: [knot.public, knot.cap, knot.sealed, knot.group]
                protocols: []
                maxBlob: 134217728
                custodialSign: false
                peers: []
  /xrpc/tangled.node.stats:
    get:
      tags: [node]
      operationId: tangled.node.stats
      summary: Public-only knot-local counts and advertised-peer topology
      responses:
        "200":
          description: Node statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeStats"
              example:
                v: 1
                did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
                asOf: 1700000000
                counts:
                  identities: 1
                  repos: 1
                  records: 2
                  blobs: 0
                  peers: 0
                  circles: 0
                  foreign: 0
                  commits: 2
                rates:
                  publicCommits: 2
                  retained: 256
                topology:
                  peers: []
                  hosted:
                    - did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
                      records: 2
                  truncated: false
  /xrpc/tangled.sync.getHead:
    get:
      tags: [sync]
      operationId: tangled.sync.getHead
      parameters:
        - in: query
          name: did
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current commit CID
          content:
            application/json:
              schema:
                type: object
                required: [did, commit, rev, knot]
                properties:
                  did: { type: string }
                  commit: { type: string, description: Signed Commit CID }
                  rev: { type: string }
                  knot: { type: string, format: uri }
                  data: { type: string, description: MST root CID (Commit.data) }
              example:
                did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
                commit: bafkr4igh2k3n4example
                rev: "3jzfcijpjiz2u"
                knot: https://knot.example
                data: bafyr4idmstrootexample
  /xrpc/tangled.sync.getRecord:
    get:
      tags: [sync]
      operationId: tangled.sync.getRecord
      parameters:
        - { in: query, name: did, required: true, schema: { type: string } }
        - { in: query, name: collection, required: true, schema: { type: string } }
        - { in: query, name: rkey, required: true, schema: { type: string } }
        - { in: header, name: Authorization, required: false, schema: { type: string } }
      responses:
        "200":
          description: Record, MST proof, commit
          content:
            application/json:
              schema:
                type: object
                required: [record, proof, commit]
                properties:
                  record: { type: object }
                  proof: { type: array, items: { type: object } }
                  commit: { type: object }
        "401":
          $ref: "#/components/responses/CapabilityRequired"
  /xrpc/tangled.sync.getBlob:
    get:
      tags: [sync]
      operationId: tangled.sync.getBlob
      parameters:
        - { in: query, name: did, required: true, schema: { type: string } }
        - { in: query, name: cid, required: true, schema: { type: string } }
        - { in: header, name: Authorization, required: false, schema: { type: string } }
      responses:
        "200":
          description: Raw blob bytes (codec raw 0x55, BLAKE3-256)
          headers:
            Content-Length:
              schema: { type: integer }
              description: Byte length of the blob
            X-Tangled-Media-Type:
              schema: { type: string }
              description: Stored MIME type from putBlob mediaType or X-Tangled-Media-Type
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/CapabilityRequired"
        "404":
          description: NotFound
  /xrpc/tangled.sync.getBlocks:
    post:
      tags: [sync]
      operationId: tangled.sync.getBlocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cids]
              properties:
                cids:
                  type: array
                  maxItems: 256
                  items: { type: string }
            example:
              cids: ["bafkr4igh2k3n4example"]
      responses:
        "200":
          description: CAR bytes or JSON { blocks, missing }
          content:
            application/vnd.ipld.car:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: object
                properties:
                  missing: { type: array, items: { type: string } }
  /xrpc/tangled.sync.getRepo:
    get:
      tags: [sync]
      operationId: tangled.sync.getRepo
      parameters:
        - { in: query, name: did, required: true, schema: { type: string } }
        - { in: query, name: since, required: false, schema: { type: string } }
        - { in: query, name: blobs, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: CAR of the public repository
          content:
            application/vnd.ipld.car:
              schema: { type: string, format: binary }
  /xrpc/tangled.sync.getRepoAuth:
    post:
      tags: [sync]
      operationId: tangled.sync.getRepoAuth
      security: [{ cap: [] }]
      parameters:
        - { in: query, name: since, required: false, schema: { type: string }, description: "Commit CID; also accepted in the JSON body" }
        - { in: query, name: blobs, required: false, schema: { type: boolean } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did: { type: string }
                since: { type: string }
                blobs: { type: boolean }
      responses:
        "200":
          description: CAR of authorized collections
          content:
            application/vnd.ipld.car:
              schema: { type: string, format: binary }
  /xrpc/tangled.sync.queryBacklinks:
    get:
      tags: [sync]
      operationId: tangled.sync.queryBacklinks
      summary: Local public backlink index for a record CID
      description: |
        Returns public records this knot already stores whose envelope ref
        (or body reply) equals cid. MUST NOT crawl. count is an untrusted overlay.
        Empty hits MUST NOT be treated as proof the network has zero comments.
      parameters:
        - { in: query, name: cid, required: true, schema: { type: string }, description: "Target record CID" }
        - { in: query, name: collection, required: false, schema: { type: string } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Observed public backlinks (overlay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkQuery"
              example:
                hits:
                  - did: did:sol:3hucrSyZCEokkGfhKtMCZgFx69qd9ZHZiBed7aEeByTw
                    collection: pub.tangled.annotation
                    rkey: 3jzfcijpjiz2u
                    cid: bafkr4igh2k3n4example
                    commit: bafkr4icommitexample
                count: 1
                overlay: true
                complete: false
        "404":
          description: MethodNotImplemented when the knot has no backlink index
  /xrpc/tangled.sync.notify:
    post:
      tags: [sync]
      operationId: tangled.sync.notify
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [did, commit]
              properties:
                did: { type: string }
                commit: { type: string }
            example:
              did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
              commit: bafkr4igh2k3n4example
      responses:
        "204": { description: Hint accepted or ignored }
  /xrpc/tangled.sync.subscribe:
    get:
      tags: [sync]
      operationId: tangled.sync.subscribe
      parameters:
        - { in: query, name: did, required: true, schema: { type: string } }
        - { in: query, name: collection, required: false, schema: { type: string } }
        - { in: query, name: since, required: false, schema: { type: string }, description: "Commit CID; replay later events then continue live" }
      responses:
        "101": { description: WebSocket upgrade }
  /xrpc/tangled.repo.putRecord:
    post:
      tags: [repo]
      operationId: tangled.repo.putRecord
      security: [{ cap: [] }, { siws: [] }]
      description: |
        Insert a signed record. Knot verifies the Solana off-chain envelope.
        Auth is SIWS cookie, repo/write Cap, or hosted identity-key write
        (no signedBy, author is a DID this knot hosts).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [record]
              properties:
                record: { type: object }
                prev: { type: string, description: Current head Commit CID; ConcurrentHeads if it does not match }
            example:
              record:
                v: 1
                collection: pub.tangled.post
                rkey: 3jzfcijpjiz2u
                vis: public
                body: { text: "hello" }
      responses:
        "200":
          description: New commit CID
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string }
                  commit: { type: string }
        "429":
          description: RateLimited (page compact admission)
          headers:
            Retry-After:
              schema: { type: integer }
              description: Delta-seconds; at least PAGE_COMPACT_MIN_INTERVAL_MS / 1000 (300)
  /xrpc/tangled.repo.putBlob:
    post:
      tags: [repo]
      operationId: tangled.repo.putBlob
      parameters:
        - { in: query, name: mediaType, required: false, schema: { type: string }, description: "MIME type stored with the blob; also accepted as X-Tangled-Media-Type" }
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Blob CID
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string }
        "413":
          description: BlobTooLarge
  /xrpc/tangled.repo.import:
    post:
      tags: [repo]
      operationId: tangled.repo.import
      security: [{ cap: [] }, { siws: [] }]
      description: Import a CAR. Requires SIWS session for the DID or repo/write.
      parameters:
        - in: query
          name: force
          schema: { type: boolean }
      requestBody:
        content:
          application/vnd.ipld.car:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  commit: { type: string }
  /xrpc/tangled.identity.resolve:
    get:
      tags: [identity]
      operationId: tangled.identity.resolve
      parameters:
        - { in: query, name: handle, required: false, schema: { type: string } }
        - { in: query, name: did, required: false, schema: { type: string } }
      responses:
        "200":
          description: DID document location
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  idCid: { type: string }
                  endpoints:
                    type: array
                    items: { type: string }
                  document: { type: object, description: Generative or operational did:sol document }
              example:
                did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
                idCid: bafkr4idexample
                endpoints: ["https://knot.example"]
            application/cbor:
              schema: { type: string, format: binary }
  /xrpc/tangled.session.challenge:
    get:
      tags: [session]
      operationId: tangled.session.challenge
      summary: Issue a Sign-In With Solana (SIWS) challenge
      description: |
        Returns the canonical SIWS message (domain, DID, nonce, issuedAt).
        The caller MUST Ed25519-sign the UTF-8 `message` bytes (not the
        Solana off-chain envelope). Challenges expire (RECOMMENDED 300s).
      parameters:
        - { in: query, name: did, required: true, schema: { type: string } }
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                required: [domain, did, nonce, issuedAt, message]
                properties:
                  domain: { type: string }
                  did: { type: string }
                  nonce: { type: string, description: "32 hex characters (16 bytes)" }
                  issuedAt: { type: integer }
                  message: { type: string }
              example:
                domain: knot.example
                did: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx
                nonce: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                issuedAt: 1700000000
                message: "tangled.siws.v1\ndomain: knot.example\ndid: did:sol:8YLTgCeE4M8XZgiJBoQBFdEJkK2K1S56cH5G1sF8QdYx\nnonce: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\nissuedAt: 1700000000"
  /xrpc/tangled.session.verify:
    post:
      tags: [session]
      operationId: tangled.session.verify
      summary: Verify SIWS signature and set tangled_session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did, nonce, signature]
              properties:
                did: { type: string }
                nonce: { type: string }
                signature: { type: string, description: "64-byte Ed25519 signature, hex" }
      responses:
        "200":
          description: Session created. Set-Cookie tangled_session (HttpOnly; Path=/; Max-Age=86400; SameSite=Lax; Secure when public URL is HTTPS).
          headers:
            Set-Cookie:
              schema: { type: string }
              example: tangled_session=ab; HttpOnly; Path=/; Max-Age=86400; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                required: [ok, did, exp]
                properties:
                  ok: { type: boolean }
                  did: { type: string }
                  exp: { type: integer }
        "400":
          description: InvalidRequest or InvalidSignature
  /xrpc/tangled.cap.verify:
    post:
      tags: [cap]
      operationId: tangled.cap.verify
      requestBody:
        content:
          application/cbor:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cmd: { type: string }
                  res: { type: string }
        "403":
          $ref: "#/components/responses/CapabilityInvalid"
  /xrpc/tangled.loom.query:
    get:
      tags: [loom]
      operationId: tangled.loom.query
      parameters:
        - { in: query, name: q, required: true, schema: { type: string } }
        - { in: query, name: type, required: false, schema: { type: string }, description: "collection name, or ref to search by parent record CID" }
      responses:
        "200":
          description: Public hits. count is an untrusted overlay; complete is false in v1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkQuery"
  /xrpc/tangled.loom.firehose:
    get:
      tags: [loom]
      operationId: tangled.loom.firehose
      responses:
        "101": { description: WebSocket of public commits }
components:
  securitySchemes:
    cap:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Cap <unpadded-base64url(DAG-CBOR(Invocation))>. JSON-in-header MUST be
        rejected (decoded payload must not start with { or [).
    siws:
      type: apiKey
      in: cookie
      name: tangled_session
      description: |
        HttpOnly; Path=/; Max-Age=86400; SameSite=Lax; Secure when the knot
        public URL is HTTPS. Knot-local login; not a record signature.
  responses:
    CapabilityRequired:
      description: Missing capability
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: CapabilityRequired
            message: vis cap or sealed requires Authorization Cap
            retry: false
    CapabilityInvalid:
      description: Capability failed verification
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        retry: { type: boolean }
    NodeDescribe:
      type: object
      required: [v, did, profiles, protocols, maxBlob]
      properties:
        v: { const: 1 }
        did: { type: string }
        profiles:
          type: array
          items: { type: string }
        protocols:
          type: array
          items: { type: string }
        maxBlob: { type: integer }
        custodialSign: { type: boolean }
        peers:
          type: array
          items: { type: string, format: uri }
          description: Operator-marked public knot base URLs. Empty when none. Never learned URLs.
    NodeStats:
      type: object
      required: [v, did, asOf, counts, rates, topology]
      properties:
        v: { const: 1 }
        did: { type: string }
        asOf: { type: integer, description: Knot clock, unix seconds }
        counts: { $ref: "#/components/schemas/NodeCounts" }
        rates: { $ref: "#/components/schemas/NodeRates" }
        topology: { $ref: "#/components/schemas/NodeTopology" }
    NodeCounts:
      type: object
      required: [identities, repos, records, blobs, peers, circles, foreign, commits]
      properties:
        identities: { type: integer, description: DIDs with at least one live public tip }
        repos: { type: integer, description: Those DIDs that also have a public head }
        records: { type: integer, description: Live vis public tips }
        blobs: { type: integer, description: Distinct blob CIDs referenced by those tips }
        peers: { type: integer, description: Operator-marked public peer URLs }
        circles: { type: integer, description: Live public sys.circle tips }
        foreign: { type: integer, description: Live public sys.foreign tips }
        commits: { type: integer, description: Retained public subscribe events }
    NodeRates:
      type: object
      required: [publicCommits, retained]
      properties:
        publicCommits: { type: integer, description: Length of the retained public commit log }
        retained: { type: integer, description: Cap of that log (256 in the reference knot) }
    NodeTopology:
      type: object
      required: [peers, hosted, truncated]
      properties:
        peers:
          type: array
          items: { type: string, format: uri }
          description: Same operator-marked set as node.describe peers. Never learned URLs.
        hosted:
          type: array
          items: { $ref: "#/components/schemas/HostedIdentity" }
        truncated: { type: boolean }
    HostedIdentity:
      type: object
      required: [did, records]
      properties:
        did: { type: string }
        handle: { type: string }
        rev: { type: string }
        records: { type: integer }
    BacklinkHit:
      type: object
      required: [did, collection, rkey, cid, commit]
      properties:
        did: { type: string }
        collection: { type: string }
        rkey: { type: string }
        cid: { type: string }
        commit: { type: string }
    BacklinkQuery:
      type: object
      required: [hits, overlay]
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/BacklinkHit" }
        count: { type: integer, description: "Untrusted overlay. Distinct matching CIDs this observer stores." }
        overlay: { type: boolean, const: true }
        complete: { type: boolean, description: "MUST be false in v1." }
