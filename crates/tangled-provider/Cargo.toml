[package]
name = "tangled-provider"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hosted Tangled knot: email account, custodial identity, public timeline"
readme = "README.md"

[lib]
name = "tangled_provider"
path = "src/lib.rs"

[[bin]]
name = "tangled-provider"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.8"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tangled = { path = "../tangled" }
tangled-import = { path = "../tangled-import" }
tangled-knot = { path = "../tangled-knot" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
