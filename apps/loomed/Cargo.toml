[package]
name = "loomed"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Loomed messenger UI (Dioxus 0.7)"
publish = false

[lib]
name = "loomed"
path = "src/lib.rs"

[[bin]]
name = "loomed"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "dep:notify-rust"]
mobile = ["dioxus/mobile"]

[dependencies]
dioxus = { version = "=0.7.10", features = ["router"] }
loomed-core = { path = "core" }
notify-rust = { version = "4", optional = true }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-solana = "0.1"

[dev-dependencies]
dioxus-ssr = "=0.7.10"
