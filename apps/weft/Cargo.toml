[package]
name = "weft"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Weft network explorer UI (Dioxus 0.7)"
publish = false

[lib]
name = "weft"
path = "src/lib.rs"

[[bin]]
name = "weft"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dependencies]
dioxus = { version = "=0.7.10", features = ["router"] }
serde_json = "1"
weft-core = { path = "core" }

[dev-dependencies]
dioxus-ssr = "=0.7.10"
